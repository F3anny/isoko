apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: isoko-api}
  template:
    metadata:
      labels: {app: isoko-api}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8080'
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 1000}
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ['ALL']}}
          env:
            - {name: DATABASE_URL, value: {{ .Values.databaseUrl | quote }}}
            - {name: REDIS_HOST, value: {{ .Values.redisHost | quote }}}
            - {name: ISOKO_LAB_CODES, value: {{ .Values.labCodes | quote }}}
          envFrom:
            - secretRef: {name: {{ .Values.secretName }}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 30}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 60}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: isoko-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: isoko-storefront}
  template:
    metadata:
      labels: {app: isoko-storefront}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, fsGroup: 101}
      containers:
        - name: storefront
          image: {{ .Values.frontend.image | quote }}
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ['ALL']}}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /, port: 8080}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: nginx-cache, mountPath: /var/cache/nginx}]
      volumes: [{name: tmp, emptyDir: {}}, {name: nginx-cache, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: storefront}
spec:
  selector: {app: isoko-storefront}
  ports: [{port: 8080, targetPort: 8080}]
