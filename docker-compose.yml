services:
  postgres:
    image: postgres:16-alpine
    container_name: isoko-postgres
    environment:
      POSTGRES_DB: isoko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Fanny1234
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - isoko-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isoko"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: isoko-redis
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    container_name: isoko-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/isoko
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: Fanny1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-isoko-dev-only-change-me-to-a-64-char-secret-key!!}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-isoko-lab-callback-secret-change-before-sharing}
      ISOKO_LAB_CODES: ${ISOKO_LAB_CODES:-true}
      PAYMENT_STUB_MODE: ${PAYMENT_STUB_MODE:-SUCCESS}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    profiles: ["app"]
    build: ./frontend
    ports: ["5173:8080"]
    depends_on: [api]

volumes:
  isoko-pg:
