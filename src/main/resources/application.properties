spring.application.name=isoko
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/isoko}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Fanny1234}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=isoko-hikari

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=cloud_sphere
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25

spring.flyway.enabled=true
spring.flyway.schemas=cloud_sphere
spring.flyway.default-schema=cloud_sphere
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

logging.level.root=INFO
logging.level.rw.ac.rca.cloudsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.repository.config=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.io.netty.resolver.dns=ERROR
logging.level.org.springdoc.core.events=ERROR

spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=false
management.observations.key-values.application=isoko

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false

cloudsphere.jwt.secret=${JWT_SECRET:cloudsphere-dev-only-change-me-to-a-64-char-secret-key!!}
cloudsphere.jwt.issuer=cloudsphere
cloudsphere.jwt.ttl=PT12H
cloudsphere.lockout.max-attempts=3
cloudsphere.lockout.duration=PT30M
cloudsphere.payment.stub-mode=${PAYMENT_STUB_MODE:SUCCESS}
cloudsphere.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
cloudsphere.seed.enabled=true

# Academic OTP delivery adapter: disable when replacing it with an SMS provider.
isoko.auth.lab-codes=${ISOKO_LAB_CODES:true}

isoko.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:isoko-lab-callback-secret-change-before-sharing}
